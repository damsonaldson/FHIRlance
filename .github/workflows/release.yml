name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint and format check
        run: ruff check . && ruff format --check .

      - name: Mypy strict type check
        run: mypy

      - name: Audit installed packages for known CVEs
        run: pip-audit --progress-spinner off

      - name: Run offline test suite with >=95% branch coverage
        run: pytest -m "not hl7_live" --cov --cov-report=term-missing --cov-fail-under=95

  build:
    name: Build & Smoke Test Release Artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install build tools
        run: python -m pip install --upgrade pip && pip install build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if tag != version:
              raise SystemExit(f"Tag version {tag!r} does not match pyproject.toml version {version!r}")
          print(f"Verified release tag v{tag} == pyproject.toml {version}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Smoke-test clean wheel installation
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/fhirlance --help
          /tmp/smoke-venv/bin/python -c "import fhirlance; assert len(fhirlance.RESOURCE_MODELS) == 146"

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/*
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fhirlance
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist

      - name: Create GitHub Release with distributions
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
