name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint (strict complexity & style)
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict type check
        run: mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit, property, and performance tests with coverage gate
        run: pytest -m "not hl7_live" --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=95

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package and audit tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Audit installed packages for known CVEs
        run: pip-audit --progress-spinner off

  build:
    name: Build & Smoke Test Distribution
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install package and build tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run build performance benchmark and update documentation
        run: python scripts/benchmark_performance.py --update-docs

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            docs/benchmark-results.json
            README.md
            docs/equivalence-and-testing.md
          retention-days: 14

      - name: Smoke-test clean wheel installation
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/fhirlance --help
          /tmp/smoke-venv/bin/python -c "import fhirlance; assert len(fhirlance.RESOURCE_MODELS) == 146"

  hl7-equivalence:
    name: Live HL7 validator_cli.jar Equivalence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download official HL7 validator_cli.jar
        run: |
          mkdir -p tools
          curl -fsSL -o tools/validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run HL7 equivalence tests
        env:
          FHIR_VALIDATOR_JAR: ${{ github.workspace }}/tools/validator_cli.jar
        run: pytest -m hl7_live -v -s

      - name: Run live HL7 vs FHIRlance benchmark and update documentation
        env:
          FHIR_VALIDATOR_JAR: ${{ github.workspace }}/tools/validator_cli.jar
        run: python scripts/benchmark_performance.py --run-hl7-live --update-docs

      - name: Upload live HL7 benchmark report artifact
        uses: actions/upload-artifact@v7
        with:
          name: hl7-benchmark-results
          path: |
            docs/benchmark-results.json
            README.md
            docs/equivalence-and-testing.md
          retention-days: 14
