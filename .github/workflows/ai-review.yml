name: AI PR Code Review (Free Gemini Tier)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gemini-review:
    name: Automated AI Code Review
    # Skip fork PRs where repository secrets are unavailable
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Gemini API key configuration
        id: check_key
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### AI Code Review Skipped"
              echo "Set the \`GEMINI_API_KEY\` repository secret (free tier from Google AI Studio) to enable automatic PR reviews."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate PR diff
        if: steps.check_key.outputs.enabled == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --unified=5 "$BASE_SHA" "$HEAD_SHA" -- \
            ':!src/fhirlance/types.py' \
            ':!src/fhirlance/resources.py' \
            ':!src/fhirlance/profiles.py' > pr_diff.patch || true

      - name: Review diff with Gemini
        if: steps.check_key.outputs.enabled == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          diff = Path("pr_diff.patch").read_text(encoding="utf-8", errors="replace").strip()
          if not diff:
              print("No handwritten source diff to review.")
              raise SystemExit(0)

          max_chars = 60_000
          if len(diff) > max_chars:
              diff = diff[:max_chars] + "\n\n... [diff truncated] ..."

          prompt = (
              "You are a senior Python & FHIR R4 reviewer following Robert C. Martin's Clean Code "
              "and SOLID principles. Review this PR diff for FHIRlance.\n"
              "Check specifically for:\n"
              "1. Correctness, edge cases, and FHIR R4 / IG profile semantics.\n"
              "2. Engineering guardrail #1: NEVER add @model_validator(mode='before') to FHIRBaseModel "
              "(keep the hot path in Rust pydantic-core).\n"
              "3. Engineering guardrail #2: NEVER hand-edit generated files (types.py, resources.py, profiles.py).\n"
              "4. Clean Code: single responsibility, shallow nesting, small functions, no duplicated logic, strict typing.\n"
              "Be concise, concrete, and cite file/line/symbol names. If everything looks solid, say LGTM with brief notes.\n\n"
              f"```diff\n{diff}\n```"
          )

          api_key = os.environ["GEMINI_API_KEY"].strip()
          payload = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.1},
          }).encode("utf-8")

          models = [
              "gemini-3.8-flash",
              "gemini-3.5-flash-lite",
              "gemini-3.1-flash-lite",
              "gemini-3.1-pro-preview",
          ]
          data = None
          used_model = None

          for model in models:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              for attempt in range(2):
                  req = urllib.request.Request(
                      url,
                      data=payload,
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": api_key,
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=90) as resp:
                          data = json.loads(resp.read().decode("utf-8"))
                          used_model = model
                          break
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      print(f"Gemini API ({model}, attempt {attempt + 1}) HTTP {exc.code}: {body}", file=sys.stderr)
                      if exc.code in (429, 500, 502, 503, 504) and attempt == 0:
                          time.sleep(4)
                          continue
                      break
                  except (TimeoutError, urllib.error.URLError, OSError) as exc:
                      print(
                          f"Gemini API ({model}, attempt {attempt + 1}) network/timeout error: {exc}",
                          file=sys.stderr,
                      )
                      if attempt == 0:
                          time.sleep(4)
                          continue
                      break
              if data is not None:
                  break

          if data is None:
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              msg = (
                  "### AI Code Review Deferred\n"
                  "Free-tier Gemini endpoints returned transient capacity, rate-limit, or timeout errors. "
                  "Skipping non-blocking review."
              )
              print(msg)
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as sf:
                      sf.write(msg + "\n")
              raise SystemExit(0)

          candidates = data.get("candidates") or []
          parts = candidates[0].get("content", {}).get("parts", []) if candidates else []
          review_text = (
              parts[0].get("text", "AI review produced no output.")
              if parts
              else "AI review produced no output."
          )

          comment_url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments"
          comment_body = json.dumps({
              "body": f"## Automated Gemini Code Review (`{used_model}`)\n\n{review_text}"
          }).encode("utf-8")
          gh_req = urllib.request.Request(
              comment_url,
              data=comment_body,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "fhirlance-ai-review",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(gh_req, timeout=30) as gh_resp:
                  print(f"Posted review comment: HTTP {gh_resp.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"GitHub API error HTTP {exc.code}: {body}", file=sys.stderr)
              raise
          PY
