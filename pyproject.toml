[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fhirlance"
version = "0.1.0"
description = "High-performance FHIR R4 structural and multi-IG profile validator backed by Pydantic v2 (Rust pydantic-core)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sam Donaldson", email = "samdonaldson.ca@gmail.com" },
]
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "hypothesis>=6.100.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "twine>=5.0.0",
]

[project.scripts]
fhirlance = "fhirlance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
xfail_strict = true
markers = [
    "hl7_live: tests invoking HL7 official validator_cli.jar via JVM (slow, requires Java + JAR)",
]

[tool.coverage.run]
branch = true
source = ["src/fhirlance"]
omit = [
    "src/fhirlance/types.py",
    "src/fhirlance/resources.py",
    "src/fhirlance/profiles.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/fhirlance/types.py",
    "src/fhirlance/resources.py",
    "src/fhirlance/profiles.py",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM",
    "C90", "PL", "ANN", "S", "BLE", "PT", "RUF",
    "PERF", "ARG", "RET", "TRY",
]
ignore = [
    "ANN401",
    "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-statements = 35
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S108", "S603", "S607", "PLR2004", "ANN"]
"scripts/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/fhirlance", "scripts", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["fhirlance.types", "fhirlance.resources", "fhirlance.profiles"]
follow_imports = "silent"
ignore_errors = true
